name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (incl. Firebase emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm install -g firebase-tools
      - name: Unit, API and evaluation tests
        working-directory: backend
        run: python -m pytest app/tests -q
      - name: Firebase Realtime Database emulator integration test
        working-directory: firebase
        run: firebase emulators:exec --only database --project demo-heatguard "cd ../backend && python -m pytest app/tests/test_firebase_emulator.py -q"

  worker_app:
    name: Worker app analyze, test & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: worker_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /worker/

  frontend:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t heatguard .
